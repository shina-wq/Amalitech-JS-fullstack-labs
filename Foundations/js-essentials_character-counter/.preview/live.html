<script>
  // Drive the real script like a user: type, set a limit, expand density
  let n = 0;
  for (const f of document.querySelectorAll("iframe")) f.onload = () => {
    const d = f.contentDocument, w = f.contentWindow, $ = (s) => d.querySelector(s);
    $("#text-input").value = SAMPLE;
    $("#text-input").dispatchEvent(new w.InputEvent("input", { bubbles: true }));
    $("#exclude-spaces").click();
    $("#limit-toggle").click();
    $("#limit-input").value = "278";
    $("#limit-input").dispatchEvent(new w.InputEvent("input", { bubbles: true }));
    $("#density-toggle").click();
  };
</script>
